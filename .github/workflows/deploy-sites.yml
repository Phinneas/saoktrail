name: Deploy Sites

on:
  # Rebuild every Sunday and Wednesday at 12:00 UTC (4-5 AM Pacific), after the
  # autoposter's 09:00-11:40 UTC post slots. GitHub runs this on its own, so no
  # token on the Cloudflare worker is needed.
  schedule:
    - cron: "0 12 * * 0,3"
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-sites]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy all sites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./deploy-all.sh
