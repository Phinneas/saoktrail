name: Publish Blog Post

on:
  schedule:
    # Run every Monday at 10:00 AM UTC (3:00 AM PST / 6:00 AM EST)
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      topic_index:
        description: 'Topic index to publish (0-8, or leave empty for next in queue)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish blog post
        env:
          WOLLY_API_KEY: ${{ secrets.WOLLY_API_KEY }}
          WOLLY_API_URL: ${{ secrets.WOLLY_API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/publish-blog.js ${{ github.event.inputs.topic_index }}

      - name: Commit updated queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/blog-content-queue.json
          git diff --cached --quiet || git commit -m "Update blog content queue after publishing"
          git push
