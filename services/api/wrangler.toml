name = "soaktherockies-api"
main = "src/index.ts"
compatibility_date = "2026-03-26"

# Required Secrets (set via `wrangler secret put <NAME>`):
# - GLM_API_KEY          (GLM-5.3 bearer token for blog generation, used by lib/minimax.js)
# - ADMIN_SECRET
# - PEXELS_API_KEY       (featured image lookup; optional but recommended)
# - ASANA_PAT            (Asana Personal Access Token for the auto-poster)
# - ASANA_PROJECT_DESERTSOAK    (Asana project GID → site slug "desertsoak")
# - ASANA_PROJECT_SOAKCOLORADO  (Asana project GID → site slug "soakcolorado")
# - ASANA_PROJECT_SOAKTHEROCKIES(Asana project GID → site slug "soaktherockies")
# - ASANA_PROJECT_ALASKAHOTSPRINGS(Asana project GID → site slug "alaskahotsprings")
# - ASANA_PROJECT_SHASTAHOTSPRINGS(Asana project GID → site slug "shastahotsprings")
# - ASANA_PROJECT_SOAKTRAIL     (Asana project GID → site slug "soaktrail")
[vars]
ENVIRONMENT = "production"
# Kill switch for the Asana autoposter. Set to "true" to re-enable.
AUTOPOSTER_ENABLED = "true"

[env.development]
vars = { ENVIRONMENT = "development" }

[env.local]
vars = { ENVIRONMENT = "local" }

[[d1_databases]]
binding = "DB"
database_name = "soaktherockies-springs-db"
database_id = "5666d199-3ec6-4076-8401-d96e072d4a17"

[ai]
binding = "AI"

# User-submitted condition-report photos (moderated before public).
[[r2_buckets]]
binding = "UGC_BUCKET"
bucket_name = "soaktrail-ugc"

[triggers]
# Autoposter re-enabled 2026-10-15 (was paused 2026-09-30 for the site merge).
# An empty list removes the cron triggers on the next deploy.
# Previous schedule (restore both lines to re-enable, and set AUTOPOSTER_ENABLED = "true"):
#   crons = ["0 7 * * 0,3", "0 8 * * 0,3"]
# Note: src/index.ts routes any "0 12 ..." cron to the deploy trigger (fixed
# 2026-09-30). The deploy trigger needs the GITHUB_PAT secret to call GitHub Actions.
# Off-peak window: 1-5 AM Pacific. Kept inside 09:00-12:00 UTC so it stays in the
# window in both PDT and PST. One post per 20-min slot, then the site deploy.
crons = ["*/20 9-11 * * SUN,WED", "0 12 * * SUN,WED"]
