name = "soaktherockies-api"
main = "src/index.ts"
compatibility_date = "2026-03-26"

# Required Secrets (set via `wrangler secret put <NAME>`):
# - MINIMAX_API_KEY      (Minimax bearer token for blog generation, used by lib/minimax.js)
# - ADMIN_SECRET
# - PEXELS_API_KEY       (featured image lookup; optional but recommended)
# - ASANA_PAT            (Asana Personal Access Token for the auto-poster)
# - ASANA_PROJECT_DESERTSOAK    (Asana project GID → site slug "desertsoak")
# - ASANA_PROJECT_SOAKCOLORADO  (Asana project GID → site slug "soakcolorado")
# - ASANA_PROJECT_SOAKTHEROCKIES(Asana project GID → site slug "soaktherockies")
# - ASANA_PROJECT_ALASKAHOTSPRINGS(Asana project GID → site slug "alaskahotsprings")
[vars]
ENVIRONMENT = "production"

[env.development]
vars = { ENVIRONMENT = "development" }

[env.local]
vars = { ENVIRONMENT = "local" }

[[d1_databases]]
binding = "DB"
database_name = "soaktherockies-springs-db"
database_id = "5666d199-3ec6-4076-8401-d96e072d4a17"

[ai]
binding = "AI"

# Service binding to WollyCMS Worker (avoids *.workers.dev subrequest 1042 error)
[[services]]
binding = "WOLLYCMS"
service = "wollycms"

[triggers]
# Run at 06:00 UTC (~11pm MST previous day) every Monday and Thursday
crons = ["0 6 * * 1,4"]
