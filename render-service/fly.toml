app = "soaktrail-render"
primary_region = "den"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # Keep one warm — avoids cold start on first purchase
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Secrets (set via: fly secrets set RENDER_SERVICE_SECRET=...)
# RENDER_SERVICE_SECRET — shared secret with the Cloudflare shop Worker
