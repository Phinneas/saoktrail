name = "soaktrail-shop"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "soaktrail-shop"
database_id = "76e82cf7-ef8b-4c2d-b307-5586e7e4c6c0"

[[r2_buckets]]
binding = "SHOP_ASSETS"
bucket_name = "soaktrail-shop-assets"

[vars]
RENDER_SERVICE_URL = "https://soaktrail-render.chesterbeard.workers.dev"
SOAKATLAS_MCP_URL = "https://soakatlas-mcp.buzzuw2.workers.dev"
R2_PUBLIC_URL = "https://r2.soaktrail.com"

# Secrets (set via: wrangler secret put <KEY>)
# STRIPE_SECRET_KEY
# STRIPE_PUBLISHABLE_KEY
# STRIPE_WEBHOOK_SECRET
# GELATO_API_KEY
# GELATO_PRODUCT_UID_12X18
# GELATO_PRODUCT_UID_18X24
# RENDER_SERVICE_SECRET
# THUNDERFOREST_API_KEY
